version: "3.8"

services:
  staysync-db:
    image: postgres:15
    container_name: staysync-monitoring-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: staysync
      POSTGRES_USER: staysync
      POSTGRES_PASSWORD: staysync123
    volumes:
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - monitoring-db-data:/var/lib/postgresql/data

  staysync-api:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: staysync-monitoring-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://staysync-db:5432/staysync
      SPRING_DATASOURCE_USERNAME: staysync
      SPRING_DATASOURCE_PASSWORD: staysync123
    depends_on:
      - staysync-db

  prometheus:
    image: prom/prometheus:latest
    container_name: staysync-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml

  grafana:
    image: grafana/grafana:latest
    container_name: staysync-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus

volumes:
  monitoring-db-data:
