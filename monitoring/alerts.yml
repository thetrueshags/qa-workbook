groups:
  - name: staysync-alerts
    rules:
      - alert: InstanceDown
        expr: up{job="staysync-api"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "StaySync API is down"
          description: "The StaySync API has been unreachable for 30 minutes."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "More than 50% of requests are failing."

      - alert: HighResponseTime
        expr: http_server_requests_seconds_sum / http_server_requests_seconds_count > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "Average response time is above 2 seconds."
