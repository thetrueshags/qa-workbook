trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistry: 'staysync.azurecr.io'
  imageName: 'staysync-api'

stages:
  - stage: Build
    displayName: 'Build & Package'
    jobs:
      - job: BuildJob
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'app/pom.xml'
              goals: 'package'
              options: '-DskipTests'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'

          - task: Docker@2
            inputs:
              containerRegistry: '$(dockerRegistry)'
              repository: '$(imageName)'
              command: 'buildAndPush'
              Dockerfile: 'app/Dockerfile'
              tags: '$(Build.BuildId)'

  - stage: Deploy
    displayName: 'Deploy to Production'
    dependsOn: Build
    jobs:
      - job: DeployJob
        steps:
          - task: KubernetesManifest@1
            inputs:
              action: 'deploy'
              namespace: 'staysync'
              manifests: |
                k8s/deployment.yaml
                k8s/service.yaml
              containers: '$(dockerRegistry)/$(imageName):latest'

  - stage: Test
    displayName: 'Run Tests'
    dependsOn: Deploy
    jobs:
      - job: TestJob
        steps:
          - task: Maven@4
            inputs:
              mavenPomFile: 'app/pom.xml'
              goals: 'test'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
